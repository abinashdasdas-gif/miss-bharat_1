<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miss Bharat World — God Level 🚀✨</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Montserrat:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&family=Inter:wght@600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --sky:#58C9F0;--sky-deep:#2BA4D8;--grass:#7BC74D;--grass-deep:#5BA832;--sun:#FFD23F;
    --coral:#FF6B6B;--purple:#9B5DE5;--pink:#F15BB5;--orange:#FF9633;--teal:#00BBB4;
    --paper:#FFFDF7;--ink:#2D3A52;--saffron:#FF9933;--igreen:#138808;
    --c1-primary:#FF6B9D;--c1-accent:#FFC75F;
    --c2-primary:#6BCB77;--c2-accent:#4D96FF;
    --c3-primary:#9B5DE5;--c3-accent:#00D9FF;
    --c4-primary:#FF006E;--c4-accent:#00F5FF;
    --c5-primary:#1D3557;--c5-accent:#F77F00;
  }

  html,body{min-height:100%;scroll-behavior:smooth}
  @keyframes orb1{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-50px)}50%{transform:translate(-30px,40px)}75%{transform:translate(50px,30px)}}
  @keyframes orb2{0%,100%{transform:translate(0,0)}25%{transform:translate(-60px,40px)}50%{transform:translate(50px,-40px)}75%{transform:translate(-40px,-50px)}}
  @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.5)}50%{box-shadow:0 0 40px rgba(99,102,241,.8)}}
  @keyframes shimmer{0%,100%{background-position:200% center}50%{background-position:-200% center}}
  @keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  @keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  body{font-family:'Nunito',sans-serif;color:var(--ink);background:var(--paper);overflow-x:hidden;position:relative}
  body::before{content:'';position:fixed;top:-50%;right:-50%;width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.15) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:0;animation:orb1 20s ease-in-out infinite}
  body::after{content:'';position:fixed;bottom:-30%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(76,29,149,.12) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:0;animation:orb2 25s ease-in-out infinite}

  .container{max-width:1200px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

  /* CLASS THEMES */
  .theme-c1{background:linear-gradient(135deg,#FFE5EC 0%,#FFF0E6 100%);--primary:#FF6B9D;--accent:#FFC75F}
  .theme-c2{background:linear-gradient(135deg,#E8F8F0 0%,#E8F5F7 100%);--primary:#6BCB77;--accent:#4D96FF}
  .theme-c3{background:linear-gradient(135deg,#F0E8FF 0%,#F0EBFF 100%);--primary:#9B5DE5;--accent:#00D9FF}
  .theme-c4{background:linear-gradient(135deg,#FFE8F5 0%,#F0E8FF 100%);--primary:#FF006E;--accent:#00F5FF}
  .theme-c5{background:linear-gradient(135deg,#1D3557 0%,#2E5090 100%);--primary:#F77F00;--accent:#06FFA5;color:#fff}

  /* LANDING PAGE */
  .landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
  .landing-title{font-family:'Montserrat',sans-serif;font-size:clamp(2.5rem,8vw,4.5rem);font-weight:900;margin:20px 0;
    background:linear-gradient(135deg,#FF6B9D,#9B5DE5,#00D9FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
  .landing-subtitle{font-size:1.5rem;color:#666;margin:20px 0;font-weight:600}
  .landing-desc{font-size:1.1rem;color:#888;max-width:600px;margin:20px auto;line-height:1.6}

  .class-selector{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:40px 0;max-width:700px;margin-left:auto;margin-right:auto}
  .class-btn{padding:20px;border:none;border-radius:18px;cursor:pointer;font-weight:700;font-size:1.2rem;transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.15)}
  .class-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.3);transform:translateX(-100%);transition:transform .3s}
  .class-btn:hover::before{transform:translateX(100%)}
  .class-btn:hover{transform:translateY(-8px) scale(1.05);box-shadow:0 12px 30px rgba(0,0,0,.25)}

  .c1-btn{background:linear-gradient(135deg,#FF6B9D,#FF8E72);color:#fff}
  .c2-btn{background:linear-gradient(135deg,#6BCB77,#4D96FF);color:#fff}
  .c3-btn{background:linear-gradient(135deg,#9B5DE5,#00D9FF);color:#fff}
  .c4-btn{background:linear-gradient(135deg,#FF006E,#FF5E78);color:#fff}
  .c5-btn{background:linear-gradient(135deg,#1D3557,#F77F00);color:#fff}

  /* CLASS PAGES */
  .class-page{display:none;min-height:100vh}
  .class-page.active{display:block;animation:slideIn .5s ease}

  .class-header{padding:30px 20px;text-align:center;position:relative;overflow:hidden}
  .class-header::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(255,255,255,.3),transparent 50%);pointer-events:none}
  .class-title{font-family:'Montserrat',sans-serif;font-size:2.5rem;font-weight:900;margin:20px 0;position:relative;z-index:1}
  .class-subtitle{font-size:1.2rem;margin:10px 0;position:relative;z-index:1;opacity:.8;font-weight:600}
  .class-description{font-size:1rem;max-width:600px;margin:15px auto;line-height:1.6;position:relative;z-index:1}

  .stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:15px;margin:30px 0;padding:20px;background:rgba(255,255,255,.6);border-radius:20px;backdrop-filter:blur(10px)}
  .stat-item{text-align:center;padding:15px;background:rgba(255,255,255,.7);border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .stat-number{font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat-label{font-size:.85rem;color:#666;margin-top:5px;font-weight:600}

  /* GAME GRID */
  .games-section{padding:40px 20px}
  .section-title{font-family:'Montserrat',sans-serif;font-size:2rem;font-weight:800;margin:30px 0 25px;text-align:center;letter-spacing:-.5px}

  .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;margin:30px 0}
  .game-card{border:none;border-radius:20px;padding:0;cursor:pointer;overflow:hidden;background:#fff;
    box-shadow:0 8px 24px rgba(0,0,0,.1);transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;
    animation:slideIn .5s ease backwards}
  .game-card:nth-child(n){animation-delay:calc(0.05s * var(--index))}

  .game-card:hover{transform:translateY(-15px) scale(1.05);box-shadow:0 16px 40px rgba(0,0,0,.2)}
  .game-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.3));opacity:0;transition:opacity .3s}
  .game-card:hover::before{opacity:1}

  .game-icon{height:100px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative}
  .game-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:.95rem;color:var(--ink);padding:12px;text-align:center;background:#fff}

  /* BADGES */
  .badge{display:inline-block;padding:4px 12px;border-radius:100px;font-size:.75rem;font-weight:800;margin:3px}
  .badge-hot{background:#FF6B6B;color:#fff}
  .badge-new{background:#6BCB77;color:#fff}
  .badge-star{background:#FFD23F;color:#1a1a2e}

  /* FOOTER */
  .footer{padding:40px 20px;text-align:center;color:#888;border-top:2px solid rgba(0,0,0,.05);margin-top:40px}
  .footer-content{max-width:1200px;margin:0 auto}

  /* FLOATING ELEMENTS */
  .floating{animation:float 3s ease-in-out infinite}
  .floating-emoji{position:fixed;font-size:2rem;opacity:.6;pointer-events:none;z-index:-1}

  /* INTERACTIVE ELEMENTS */
  .emoji-scatter{position:absolute;font-size:2rem;animation:float 4s ease-in-out infinite}

  /* RESPONSIVE */
  @media(max-width:768px){
    .class-selector{grid-template-columns:repeat(2,1fr)}
    .game-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:15px}
    .landing-title{font-size:clamp(1.8rem,6vw,2.8rem)}
  }

  /* ANIMATIONS */
  .glow-text{animation:glow 2s ease-in-out infinite}

  .confetti{position:fixed;pointer-events:none}
  @keyframes confetti-fall{
    to{transform:translateY(100vh) rotate(360deg);opacity:0}
  }

  /* PREMIUM CARDS */
  .premium-card{background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.6);
    border-radius:20px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.8);
    transition:all .3s ease}
  .premium-card:hover{transform:translateY(-5px);box-shadow:0 15px 50px rgba(0,0,0,.15)}

  .voice-fab{position:fixed;bottom:30px;right:30px;width:70px;height:70px;border-radius:50%;border:none;
    background:linear-gradient(135deg,var(--saffron),var(--coral));color:#fff;font-size:32px;cursor:pointer;
    box-shadow:0 8px 24px rgba(255,107,107,.4);z-index:100;transition:all .3s cubic-bezier(.34,1.56,.64,1);
    display:flex;align-items:center;justify-content:center;animation:pulse 2s ease-in-out infinite}
  .voice-fab:hover{transform:scale(1.15);box-shadow:0 12px 32px rgba(255,107,107,.6)}

  .close-btn{position:fixed;top:20px;left:20px;z-index:200;width:50px;height:50px;border-radius:50%;border:none;
    background:#fff;color:#333;font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);
    transition:all .2s;display:none}
  .close-btn.show{display:flex;align-items:center;justify-content:center}
  .close-btn:hover{background:#f0f0f0;transform:scale(1.1)}
</style>
</head>
<body>

<!-- LANDING PAGE -->
<div class="landing theme-c1" id="landingPage">
  <div class="container">
    <div style="font-size:5rem;margin-bottom:20px;animation:float 4s ease-in-out infinite">👩‍🏫✨</div>
    <h1 class="landing-title">Miss Bharat World</h1>
    <p class="landing-subtitle">God Level Edition 🚀</p>
    <p class="landing-desc">Welcome to the ultimate interactive learning platform! Choose your class level and embark on an amazing educational adventure with unique games, stories, and challenges tailored just for you!</p>

    <div style="margin:40px 0">
      <p style="font-size:.95rem;color:#888;margin-bottom:20px;font-weight:600">🎒 SELECT YOUR CLASS:</p>
      <div class="class-selector">
        <button class="class-btn c1-btn" onclick="selectClass(1)">
          <span>Class 1</span><br><span style="font-size:.7rem;opacity:.9">Age 6</span>
        </button>
        <button class="class-btn c2-btn" onclick="selectClass(2)">
          <span>Class 2</span><br><span style="font-size:.7rem;opacity:.9">Age 7</span>
        </button>
        <button class="class-btn c3-btn" onclick="selectClass(3)">
          <span>Class 3</span><br><span style="font-size:.7rem;opacity:.9">Age 8</span>
        </button>
        <button class="class-btn c4-btn" onclick="selectClass(4)">
          <span>Class 4</span><br><span style="font-size:.7rem;opacity:.9">Age 9</span>
        </button>
        <button class="class-btn c5-btn" onclick="selectClass(5)">
          <span>Class 5</span><br><span style="font-size:.7rem;opacity:.9">Age 10</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- CLASS PAGES -->
<div id="classPages"></div>

<!-- CLOSE BUTTON -->
<button class="close-btn" id="closeBtn" onclick="backToLanding()">✕</button>

<!-- VOICE FAB -->
<button class="voice-fab" id="voiceFab" title="Voice Control">🎤</button>

<script>
const CLASS_DATA = {
  1: {
    title: 'Class 1 🌟',
    subtitle: 'Fun Adventures for Little Learners',
    description: 'Simple games, bright colors, and lots of fun! Learn by playing with numbers, letters, and shapes!',
    theme: 'theme-c1',
    games: [
      {name: 'Count Me', emoji: '🔢', badge: 'FUN'},
      {name: 'Color Play', emoji: '🎨', badge: 'NEW'},
      {name: 'Letter Quest', emoji: '🔤', badge: 'HOT'},
      {name: 'Shape Hunt', emoji: '🔷', badge: 'FUN'},
      {name: 'Rhyme Time', emoji: '🎵', badge: 'NEW'},
      {name: 'Memory Game', emoji: '🧠', badge: 'FUN'},
      {name: 'Story Time', emoji: '📖', badge: 'STAR'},
      {name: 'Voice Chat', emoji: '👩‍🏫', badge: 'TALK'},
    ],
    stats: {games: 8, difficulty: 'Easy', time: '15-20 min'},
  },
  2: {
    title: 'Class 2 🚀',
    subtitle: 'Growing Smart with Adventures',
    description: 'Challenge yourself with word building, pattern games, and creative stories. Level up your skills!',
    theme: 'theme-c2',
    games: [
      {name: 'Word Builder', emoji: '📝', badge: 'SMART'},
      {name: 'Number Friends', emoji: '🔢', badge: 'NEW'},
      {name: 'Pattern Quest', emoji: '🎲', badge: 'HOT'},
      {name: 'Riddle Master', emoji: '🧩', badge: 'FUN'},
      {name: 'Story Creator', emoji: '📖', badge: 'STAR'},
      {name: 'Chat Master', emoji: '💬', badge: 'TALK'},
      {name: 'Music Rhythm', emoji: '🎵', badge: 'NEW'},
      {name: 'Speed Count', emoji: '⚡', badge: 'FAST'},
    ],
    stats: {games: 8, difficulty: 'Medium', time: '20-25 min'},
  },
  3: {
    title: 'Class 3 ⭐',
    subtitle: 'Knowledge Explorer',
    description: 'Dive deep into quizzes, puzzles, and logic games. Expand your knowledge and problem-solving skills!',
    theme: 'theme-c3',
    games: [
      {name: 'Knowledge Quiz', emoji: '🧠', badge: 'BRAIN'},
      {name: 'Word Puzzle', emoji: '🔍', badge: 'HOT'},
      {name: 'Math Master', emoji: '📐', badge: 'CHALLENGE'},
      {name: 'Logic Game', emoji: '⚙️', badge: 'SMART'},
      {name: 'Science Quest', emoji: '🔬', badge: 'NEW'},
      {name: 'Story Master', emoji: '📚', badge: 'STAR'},
      {name: 'Debate Time', emoji: '🗣️', badge: 'TALK'},
      {name: 'Chess Challenge', emoji: '♟️', badge: 'STRATEGY'},
    ],
    stats: {games: 8, difficulty: 'Hard', time: '25-30 min'},
  },
  4: {
    title: 'Class 4 🎯',
    subtitle: 'Advanced Challenger',
    description: 'Master complex challenges, strategic thinking, and advanced problem-solving. Push your limits!',
    theme: 'theme-c4',
    games: [
      {name: 'Advanced Quiz', emoji: '🏆', badge: 'EXPERT'},
      {name: 'Code Breaker', emoji: '💻', badge: 'HARD'},
      {name: 'Debate Topics', emoji: '🎤', badge: 'CHALLENGE'},
      {name: 'Research Quest', emoji: '📊', badge: 'SMART'},
      {name: 'Strategy Game', emoji: '♟️', badge: 'COMPLEX'},
      {name: 'Data Analysis', emoji: '📈', badge: 'NEW'},
      {name: 'Story Craft', emoji: '✍️', badge: 'CREATIVE'},
      {name: 'Master Chat', emoji: '🧠', badge: 'ADVANCED'},
    ],
    stats: {games: 8, difficulty: 'Very Hard', time: '30-40 min'},
  },
  5: {
    title: 'Class 5 👑',
    subtitle: 'Elite Champion League',
    description: 'The ultimate challenge awaits! Compete, create, and showcase mastery across all domains!',
    theme: 'theme-c5',
    games: [
      {name: 'Championship Quiz', emoji: '🏅', badge: 'ELITE'},
      {name: 'Master Challenge', emoji: '👑', badge: 'LEGENDARY'},
      {name: 'Tournament Mode', emoji: '🏆', badge: 'COMPETE'},
      {name: 'Create Project', emoji: '🎨', badge: 'CREATIVE'},
      {name: 'Global Quest', emoji: '🌍', badge: 'WORLD'},
      {name: 'Leaderboard', emoji: '📊', badge: 'RANK'},
      {name: 'Master Craft', emoji: '⭐', badge: 'ULTIMATE'},
      {name: 'AI Chat Pro', emoji: '🤖', badge: 'GENIUS'},
    ],
    stats: {games: 8, difficulty: 'Insane', time: '40-50 min'},
  }
};

function selectClass(classNum) {
  document.getElementById('landingPage').style.display = 'none';
  document.getElementById('closeBtn').classList.add('show');
  const page = document.getElementById(`class-page-${classNum}`);
  if (page) {
    page.classList.add('active');
    window.scrollTo(0, 0);
  }
}

function backToLanding() {
  document.querySelectorAll('[id^="class-page-"]').forEach(p => p.classList.remove('active'));
  document.getElementById('landingPage').style.display = 'flex';
  document.getElementById('closeBtn').classList.remove('show');
  window.scrollTo(0, 0);
}

function renderClassPages() {
  const container = document.getElementById('classPages');
  Object.entries(CLASS_DATA).forEach(([classNum, data]) => {
    const page = document.createElement('div');
    page.id = `class-page-${classNum}`;
    page.className = `class-page ${data.theme}`;

    let gamesHTML = data.games.map((game, idx) => `
      <div class="game-card premium-card" style="--index:${idx}">
        <div class="game-icon">${game.emoji}</div>
        <div class="game-name">${game.name}</div>
        <div style="padding:8px;text-align:center">
          <span class="badge badge-${game.badge.toLowerCase()}">${game.badge}</span>
        </div>
      </div>
    `).join('');

    page.innerHTML = `
      <div class="class-header">
        <h1 class="class-title">${data.title}</h1>
        <p class="class-subtitle">${data.subtitle}</p>
        <p class="class-description">${data.description}</p>
      </div>

      <div class="container">
        <div class="stats-bar">
          <div class="stat-item">
            <div class="stat-number">${data.stats.games}</div>
            <div class="stat-label">Games</div>
          </div>
          <div class="stat-item">
            <div class="stat-number">${data.stats.difficulty}</div>
            <div class="stat-label">Level</div>
          </div>
          <div class="stat-item">
            <div class="stat-number">${data.stats.time}</div>
            <div class="stat-label">Time</div>
          </div>
        </div>

        <div class="games-section">
          <h2 class="section-title">🎮 Available Games</h2>
          <div class="game-grid">${gamesHTML}</div>
        </div>
      </div>

      <div class="footer">
        <div class="footer-content">
          <p>✨ Each game is specially designed for Class ${classNum} learners</p>
          <p style="margin-top:15px;font-size:.9rem">Voice control available • Progress tracking • Achievements unlocked</p>
        </div>
      </div>
    `;

    container.appendChild(page);
  });
}

renderClassPages();

// Voice control setup
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'en-US';
  let on = false;

  const fab = document.getElementById('voiceFab');
  fab.onclick = () => {
    on ? rec.stop() : rec.start();
    on = !on;
    fab.style.animation = on ? 'pulse 0.6s infinite' : 'pulse 2s infinite';
  };

  rec.onresult = (e) => {
    let heard = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      heard += e.results[i][0].transcript;
    }
    handleVoiceCommand(heard.toLowerCase());
  };

  rec.onerror = () => {
    on = false;
    fab.style.animation = 'pulse 2s infinite';
  };
}

function handleVoiceCommand(text) {
  for (let i = 1; i <= 5; i++) {
    if (text.includes(`class ${i}`)) {
      selectClass(i);
      break;
    }
  }
}
</script>

</body>
</html>
