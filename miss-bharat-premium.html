<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miss Bharat World — Premium Master Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --primary:#6366F1;--primary-light:#818CF8;--primary-dark:#4F46E5;
  --accent:#EC4899;--accent-light:#F472B6;
  --success:#10B981;--warning:#F59E0B;--danger:#EF4444;
  --dark:#0F172A;--slate:#64748B;--light:#F8FAFC;
  --gradient-1:linear-gradient(135deg,#6366F1 0%,#EC4899 100%);
  --gradient-2:linear-gradient(135deg,#3B82F6 0%,#10B981 100%);
  --gradient-3:linear-gradient(135deg,#EC4899 0%,#F59E0B 100%);
  --gradient-dark:linear-gradient(135deg,#0F172A 0%,#1E293B 100%);
}

html,body{min-height:100%;background:var(--dark)}
body{font-family:'Poppins',sans-serif;color:#E2E8F0;overflow-x:hidden;line-height:1.6}

::-webkit-scrollbar{width:12px}
::-webkit-scrollbar-track{background:#1E293B}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--primary-light)}

@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.3)}50%{box-shadow:0 0 40px rgba(99,102,241,.6)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
@keyframes slideCard{0%{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

/* HEADER */
.hub-header{
  position:relative;overflow:hidden;padding:80px 20px 120px;
  background:var(--gradient-dark);border-bottom:2px solid rgba(99,102,241,.2)
}

.header-orbs{position:absolute;inset:0;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4}
.orb-1{width:500px;height:500px;background:rgba(99,102,241,.4);top:-150px;right:-150px;animation:float 25s ease-in-out infinite}
.orb-2{width:400px;height:400px;background:rgba(236,72,153,.3);bottom:-100px;left:-100px;animation:float 30s ease-in-out infinite 5s}
.orb-3{width:350px;height:350px;background:rgba(16,185,129,.25);top:30%;right:5%;animation:float 28s ease-in-out infinite 10s}

.hub-brand{position:relative;z-index:10;text-align:center;animation:fadeInUp .8s ease}
.hub-ava{
  width:160px;height:160px;border-radius:50%;background:var(--gradient-1);padding:3px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 30px;
  box-shadow:0 0 80px rgba(99,102,241,.5),inset 0 0 80px rgba(255,255,255,.1);
  animation:float 4s ease-in-out infinite,glow 3s ease-in-out infinite
}
.hub-ava-inner{width:100%;height:100%;border-radius:50%;background:#0F172A;display:flex;align-items:center;justify-content:center;font-size:90px}

.hub-title h1{
  font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(3rem,9vw,4.5rem);
  background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;letter-spacing:-2px;margin-bottom:15px;line-height:1
}
.hub-title p{font-size:1.3rem;color:#CBD5E1;font-weight:600;letter-spacing:.5px;margin-top:10px}
.hub-badge{display:inline-block;background:rgba(99,102,241,.2);border:1px solid var(--primary);color:var(--primary-light);padding:8px 20px;border-radius:50px;font-size:.85rem;font-weight:700;margin-top:20px}

/* CLASS SELECTOR */
.cls-bar{position:relative;z-index:5;max-width:1200px;margin:-60px auto 0;padding:0 20px;animation:slideInDown .8s ease .2s backwards}
.cls-bar-inner{
  background:rgba(15,23,42,.9);backdrop-filter:blur(30px);border:1.5px solid rgba(99,102,241,.25);
  border-radius:25px;padding:40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)
}
.cls-q{font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.3rem;color:#E2E8F0;margin-bottom:25px;letter-spacing:-.5px}
.cls-chips{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}
.cls-chip{
  font-family:'Poppins',sans-serif;font-weight:700;border:2.5px solid rgba(99,102,241,.3);
  background:transparent;color:#CBD5E1;padding:14px 28px;border-radius:50px;cursor:pointer;
  transition:all .4s cubic-bezier(.25,1,.5,1);font-size:1rem;position:relative;overflow:hidden
}
.cls-chip::before{content:'';position:absolute;inset:0;background:var(--gradient-1);opacity:0;transition:opacity .4s;z-index:-1}
.cls-chip:hover{transform:translateY(-5px) scale(1.05);border-color:var(--primary-light);color:#fff}
.cls-chip.on{
  background:var(--gradient-1);border-color:transparent;color:#fff;box-shadow:0 15px 40px rgba(99,102,241,.5);
  transform:scale(1.12)
}

/* GAME GRID */
.grid-wrap{max-width:1500px;margin:80px auto 0;padding:0 20px 100px}
.grid-label{
  font-family:'Montserrat',sans-serif;font-weight:900;font-size:2.5rem;text-align:center;
  margin-bottom:50px;color:#E2E8F0;letter-spacing:-1px;animation:fadeInUp .8s ease .3s backwards
}

.tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px}

.tile{
  position:relative;cursor:pointer;border:2px solid rgba(99,102,241,.2);overflow:hidden;
  background:linear-gradient(135deg,rgba(30,41,59,.6) 0%,rgba(15,23,42,.8) 100%);
  border-radius:20px;padding:0;transition:all .4s cubic-bezier(.25,1,.5,1);
  box-shadow:0 10px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1);
  animation:slideCard .6s ease backwards
}
.tile:nth-child(1){animation-delay:.1s}
.tile:nth-child(2){animation-delay:.15s}
.tile:nth-child(3){animation-delay:.2s}
.tile:nth-child(4){animation-delay:.25s}
.tile:nth-child(5){animation-delay:.3s}
.tile:nth-child(n+6){animation-delay:calc(.3s + (var(--index) - 5) * .05s)}

.tile::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,transparent 50%);opacity:0;transition:opacity .4s;z-index:1}
.tile:hover::before{opacity:1}
.tile:hover{transform:translateY(-15px) scale(1.05);border-color:var(--primary);box-shadow:0 25px 60px rgba(99,102,241,.4)}
.tile:active{transform:translateY(-8px) scale(1.02)}

.tile-top{
  height:120px;display:flex;align-items:center;justify-content:center;font-size:60px;
  position:relative;overflow:hidden;background:var(--gradient-1);
  animation:pulse 3s ease-in-out infinite
}
.tile-top::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:shimmer 3s infinite;background-size:200% 100%}
.tile-name{
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.1rem;color:#E2E8F0;
  padding:18px;text-align:center;background:transparent;letter-spacing:-.3px
}

/* FOOTER */
.footer{text-align:center;padding:60px 20px;color:#64748B;border-top:1px solid rgba(99,102,241,.1);margin-top:60px;animation:fadeInUp .8s ease .5s backwards}
.footer p{margin:8px 0;font-size:.95rem}
.footer-brand{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--primary-light);font-size:1.1rem;margin:15px 0}

/* RESPONSIVE */
@media(max-width:768px){
  .hub-header{padding:50px 20px 80px}
  .hub-title h1{font-size:2.5rem}
  .cls-bar-inner{padding:25px}
  .tile-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
  .tile-top{height:100px;font-size:45px}
  .orb{filter:blur(50px)}
}

@media(max-width:480px){
  .hub-ava{width:120px;height:120px;font-size:70px}
  .hub-title h1{font-size:2rem}
  .hub-title p{font-size:1rem}
  .tile-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="hub-header">
  <div class="header-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="hub-brand">
    <div class="hub-ava"><div class="hub-ava-inner">👑</div></div>
    <div class="hub-title">
      <h1>Miss Bharat World</h1>
      <p>Premium Master Edition</p>
      <span class="hub-badge">✨ Interactive Learning Platform</span>
    </div>
  </div>
</div>

<div class="cls-bar">
  <div class="cls-bar-inner">
    <div class="cls-q">🎓 Select Your Class Level</div>
    <div class="cls-chips" id="clsChips">
      <button class="cls-chip on" onclick="setClass(1,this)">🌟 Class 1</button>
      <button class="cls-chip" onclick="setClass(2,this)">🚀 Class 2</button>
      <button class="cls-chip" onclick="setClass(3,this)">⭐ Class 3</button>
      <button class="cls-chip" onclick="setClass(4,this)">🎯 Class 4</button>
      <button class="cls-chip" onclick="setClass(5,this)">👑 Class 5</button>
    </div>
  </div>
</div>

<div class="grid-wrap">
  <div class="grid-label">🎮 Available Games</div>
  <div class="tile-grid">
    <button class="tile" onclick="openGame('quiz')" style="--index:1"><span class="tile-top">🏆</span><div class="tile-name">Quiz Adventure</div></button>
    <button class="tile" onclick="openGame('count')" style="--index:2"><span class="tile-top">🔢</span><div class="tile-name">Counting Fun</div></button>
    <button class="tile" onclick="openGame('balloon')" style="--index:3"><span class="tile-top">🎈</span><div class="tile-name">Balloon Pop</div></button>
    <button class="tile" onclick="openGame('memory')" style="--index:4"><span class="tile-top">🧠</span><div class="tile-name">Memory Match</div></button>
    <button class="tile" onclick="openGame('words')" style="--index:5"><span class="tile-top">🔤</span><div class="tile-name">Word Builder</div></button>
    <button class="tile" onclick="openGame('roti')" style="--index:6"><span class="tile-top">🫓</span><div class="tile-name">Roti Fractions</div></button>
    <button class="tile" onclick="openGame('tables')" style="--index:7"><span class="tile-top">✖️</span><div class="tile-name">Times Tables</div></button>
    <button class="tile" onclick="openGame('story')" style="--index:8"><span class="tile-top">📖</span><div class="tile-name">Story Time</div></button>
  </div>
</div>

<div class="footer">
  <div class="footer-brand">Miss Bharat World</div>
  <p>✨ Interactive Learning Games for Classes 1-5</p>
  <p style="margin-top:20px;font-size:.85rem;color:#475569">Made with ❤️ for kids learning with Miss Bharat | Powered by Claude AI</p>
</div>

<script>
let kidClass = 1;
let gScore = 0;
const DIFF = {1:{addMax:5,subMax:5,countMax:10},2:{addMax:9,subMax:9,countMax:20},3:{addMax:15,subMax:12,countMax:30},4:{addMax:25,subMax:20,countMax:50},5:{addMax:50,subMax:40,countMax:100}};

function D(){return DIFF[kidClass];}

function setClass(n,el){
  kidClass=n;
  document.querySelectorAll('.cls-chip').forEach(c=>c.classList.remove('on'));
  if(el)el.classList.add('on');
}

function openGame(g){
  alert('🎮 Game: ' + ['Quiz','Count','Balloon','Memory','Words','Fractions','Tables','Story'][['quiz','count','balloon','memory','words','roti','tables','story'].indexOf(g)] + '\n\nClass: ' + kidClass + '\n\n✨ Start playing!');
}
</script>

</body>
</html>
