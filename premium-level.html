<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miss Bharat World — Premium Level 👑</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Montserrat:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

@keyframes slideInDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.3)}50%{box-shadow:0 0 40px rgba(99,102,241,.6)}}
@keyframes shimmer{0%,100%{background-position:200% center}50%{background-position:-200% center}}

html,body{min-height:100%;font-family:'Nunito',sans-serif;scroll-behavior:smooth}

/* CLASS THEMES */
.theme-c1{background:linear-gradient(135deg,#FFE5EC 0%,#FFF0E6 100%)}
.theme-c2{background:linear-gradient(135deg,#E8F8F0 0%,#E8F5F7 100%)}
.theme-c3{background:linear-gradient(135deg,#F0E8FF 0%,#F0EBFF 100%)}
.theme-c4{background:linear-gradient(135deg,#FFE8F5 0%,#F0E8FF 100%)}
.theme-c5{background:linear-gradient(135deg,#1D3557 0%,#2E5090 100%);color:#fff}

body{color:#2D3A52;overflow-x:hidden;transition:background 0.5s ease}

/* HEADER */
.header{padding:40px 20px;text-align:center;animation:slideInDown 0.8s ease;position:relative;z-index:10}
.header-title{font-family:'Montserrat',sans-serif;font-size:clamp(2rem,8vw,3.5rem);font-weight:900;margin:15px 0;background:linear-gradient(135deg,#FF6B9D,#9B5DE5,#00D9FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.header-subtitle{font-size:1.3rem;opacity:0.8;margin:10px 0;font-weight:600}
.header-emoji{font-size:3rem;animation:float 4s ease-in-out infinite;display:inline-block;margin-right:10px}

/* CLASS SELECTOR */
.class-selector{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:35px auto;max-width:650px;padding:0 20px;animation:slideUp 0.8s ease 0.2s backwards}
.class-btn{padding:18px;border:none;border-radius:16px;cursor:pointer;font-weight:700;font-size:1.1rem;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.15);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.class-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.2);transform:translateX(-100%);transition:transform 0.3s}
.class-btn:hover::before{transform:translateX(100%)}
.class-btn:hover{transform:translateY(-8px) scale(1.08);box-shadow:0 12px 30px rgba(0,0,0,0.25)}
.class-btn:active{transform:translateY(-4px) scale(1.04)}
.c1-btn{background:linear-gradient(135deg,#FF6B9D,#FF8E72);color:#fff}
.c2-btn{background:linear-gradient(135deg,#6BCB77,#4D96FF);color:#fff}
.c3-btn{background:linear-gradient(135deg,#9B5DE5,#00D9FF);color:#fff}
.c4-btn{background:linear-gradient(135deg,#FF006E,#FF5E78);color:#fff}
.c5-btn{background:linear-gradient(135deg,#1D3557,#F77F00);color:#fff}

.class-label{font-size:0.75rem;opacity:0.9;font-weight:500}

/* CONTAINER */
.container{max-width:1100px;margin:0 auto;padding:0 20px}

/* CLASS PAGE */
.class-page{display:none;min-height:100vh;padding:40px 20px;animation:fadeIn 0.6s ease}
.class-page.active{display:block}

.class-info{text-align:center;margin-bottom:40px;animation:slideUp 0.8s ease 0.1s backwards}
.class-info h2{font-family:'Montserrat',sans-serif;font-size:2.2rem;font-weight:900;margin:20px 0;letter-spacing:-0.5px}
.class-info p{font-size:1.1rem;opacity:0.85;line-height:1.6;max-width:600px;margin:15px auto}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px;margin:30px 0;padding:25px;background:rgba(255,255,255,0.6);border-radius:20px;backdrop-filter:blur(10px);animation:slideUp 0.8s ease 0.2s backwards}
.stat{text-align:center;padding:20px;background:rgba(255,255,255,0.8);border-radius:15px;transition:all 0.3s}
.stat:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(0,0,0,0.1)}
.stat-num{font-family:'Montserrat',sans-serif;font-size:2rem;font-weight:900;background:linear-gradient(135deg,#FF6B9D,#9B5DE5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block}
.stat-label{font-size:0.85rem;opacity:0.7;margin-top:8px;font-weight:600}

/* GAMES GRID */
.games-title{font-family:'Montserrat',sans-serif;font-size:1.8rem;font-weight:800;text-align:center;margin:40px 0 25px;letter-spacing:-0.5px;animation:slideUp 0.8s ease 0.3s backwards}

.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;margin:30px 0;animation:slideUp 0.8s ease 0.4s backwards}

.game-card{background:#fff;border-radius:18px;padding:0;cursor:pointer;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.12);transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);position:relative;border:2px solid rgba(255,255,255,0)}
.game-card:hover{transform:translateY(-15px) scale(1.05);box-shadow:0 16px 40px rgba(0,0,0,0.2);border-color:rgba(99,102,241,0.3)}
.game-card:active{transform:translateY(-10px) scale(1.02)}

.game-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,0.4));opacity:0;transition:opacity 0.3s;z-index:1}
.game-card:hover::before{opacity:1}

.game-icon{height:100px;display:flex;align-items:center;justify-content:center;font-size:50px;position:relative;z-index:0}
.game-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:0.95rem;color:#2D3A52;padding:12px;text-align:center;background:#fff;position:relative;z-index:2}

/* FOOTER */
.footer{text-align:center;padding:40px 20px;color:#888;margin-top:40px;animation:slideUp 0.8s ease 0.5s backwards}

/* RESPONSIVE */
@media(max-width:600px){
.header-title{font-size:1.8rem}
.class-selector{grid-template-columns:repeat(5,1fr);gap:8px}
.class-btn{padding:12px;font-size:0.9rem}
.game-grid{grid-template-columns:repeat(2,1fr);gap:12px}
}

/* SMOOTH TRANSITIONS */
* {transition:color 0.3s ease,background 0.3s ease}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header theme-c1" id="headerBg">
  <div class="header-emoji">👑</div>
  <h1 class="header-title">Premium Level</h1>
  <p class="header-subtitle">Interactive Learning Games for All Classes</p>
</div>

<!-- CLASS SELECTOR -->
<div class="container">
  <div class="class-selector">
    <button class="class-btn c1-btn" onclick="selectClass(1)" data-class="1">
      <span>🌟</span>
      <span class="class-label">Class 1</span>
    </button>
    <button class="class-btn c2-btn" onclick="selectClass(2)" data-class="2">
      <span>🚀</span>
      <span class="class-label">Class 2</span>
    </button>
    <button class="class-btn c3-btn" onclick="selectClass(3)" data-class="3">
      <span>⭐</span>
      <span class="class-label">Class 3</span>
    </button>
    <button class="class-btn c4-btn" onclick="selectClass(4)" data-class="4">
      <span>🎯</span>
      <span class="class-label">Class 4</span>
    </button>
    <button class="class-btn c5-btn" onclick="selectClass(5)" data-class="5">
      <span>👑</span>
      <span class="class-label">Class 5</span>
    </button>
  </div>
</div>

<!-- CLASS PAGES -->
<div id="classPages"></div>

<!-- GAME VIEW -->
<div id="gameView" style="display:none;min-height:100vh;flex-direction:column;background:#f9f7ff">
  <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,#9B5DE5,#F15BB5);flex-wrap:wrap">
    <button style="border:none;background:rgba(255,255,255,.3);color:#fff;font-weight:600;font-size:.95rem;padding:8px 16px;border-radius:100px;cursor:pointer;transition:all .2s" onclick="closeGame()">← Home</button>
    <h2 id="gameTitle" style="font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.2rem;margin:0">Game</h2>
    <div style="margin-left:auto;background:rgba(255,255,255,.3);padding:6px 12px;border-radius:100px;font-weight:600">⭐ <span id="gScore">0</span></div>
  </div>
  <div id="gameStage" style="flex:1;max-width:600px;width:100%;margin:0 auto;padding:16px 16px 40px"></div>
</div>

<!-- FOOTER -->
<div class="footer">
  <p>✨ Made with ❤️ for kids learning with Miss Bharat</p>
  <p style="margin-top:15px;font-size:0.9rem;opacity:0.6">🎮 Interactive Games | 🎤 Voice Control | 📖 Story Creator</p>
</div>

<script>
const CLASS_DATA = {
  1: {
    title: 'Class 1 🌟',
    subtitle: 'Fun Adventures for Little Learners (Age 6)',
    description: 'Simple games with bright colors and lots of fun! Learn numbers, letters, shapes, and colors through play.',
    themeClass: 'theme-c1',
    games: [
      {name: 'Count Me', emoji: '🔢'},
      {name: 'Color Play', emoji: '🎨'},
      {name: 'Letter Quest', emoji: '🔤'},
      {name: 'Shape Hunt', emoji: '🔷'},
      {name: 'Rhyme Time', emoji: '🎵'},
      {name: 'Memory Game', emoji: '🧠'},
      {name: 'Story Time', emoji: '📖'},
      {name: 'Voice Chat', emoji: '👩‍🏫'},
    ],
    stats: {games: 8, level: 'Easy', time: '15-20 min'},
  },
  2: {
    title: 'Class 2 🚀',
    subtitle: 'Growing Smart with Adventures (Age 7)',
    description: 'Challenge yourself with word building, patterns, and creative stories. Level up your skills with engaging games!',
    themeClass: 'theme-c2',
    games: [
      {name: 'Word Builder', emoji: '📝'},
      {name: 'Number Friends', emoji: '🔢'},
      {name: 'Pattern Quest', emoji: '🎲'},
      {name: 'Riddle Master', emoji: '🧩'},
      {name: 'Story Creator', emoji: '📖'},
      {name: 'Chat Master', emoji: '💬'},
      {name: 'Music Rhythm', emoji: '🎵'},
      {name: 'Speed Count', emoji: '⚡'},
    ],
    stats: {games: 8, level: 'Medium', time: '20-25 min'},
  },
  3: {
    title: 'Class 3 ⭐',
    subtitle: 'Knowledge Explorer (Age 8)',
    description: 'Dive deep into quizzes, puzzles, and logic games. Expand your knowledge and problem-solving skills!',
    themeClass: 'theme-c3',
    games: [
      {name: 'Knowledge Quiz', emoji: '🧠'},
      {name: 'Word Puzzle', emoji: '🔍'},
      {name: 'Math Master', emoji: '📐'},
      {name: 'Logic Game', emoji: '⚙️'},
      {name: 'Science Quest', emoji: '🔬'},
      {name: 'Story Master', emoji: '📚'},
      {name: 'Debate Time', emoji: '🗣️'},
      {name: 'Chess Challenge', emoji: '♟️'},
    ],
    stats: {games: 8, level: 'Hard', time: '25-30 min'},
  },
  4: {
    title: 'Class 4 🎯',
    subtitle: 'Advanced Challenger (Age 9)',
    description: 'Master complex challenges, strategic thinking, and advanced problem-solving. Push your limits!',
    themeClass: 'theme-c4',
    games: [
      {name: 'Advanced Quiz', emoji: '🏆'},
      {name: 'Code Breaker', emoji: '💻'},
      {name: 'Debate Topics', emoji: '🎤'},
      {name: 'Research Quest', emoji: '📊'},
      {name: 'Strategy Game', emoji: '♟️'},
      {name: 'Data Analysis', emoji: '📈'},
      {name: 'Story Craft', emoji: '✍️'},
      {name: 'Master Chat', emoji: '🧠'},
    ],
    stats: {games: 8, level: 'Very Hard', time: '30-40 min'},
  },
  5: {
    title: 'Class 5 👑',
    subtitle: 'Elite Champion League (Age 10)',
    description: 'The ultimate challenge awaits! Compete, create, and showcase mastery across all domains!',
    themeClass: 'theme-c5',
    games: [
      {name: 'Championship Quiz', emoji: '🏅'},
      {name: 'Master Challenge', emoji: '👑'},
      {name: 'Tournament Mode', emoji: '🏆'},
      {name: 'Create Project', emoji: '🎨'},
      {name: 'Global Quest', emoji: '🌍'},
      {name: 'Leaderboard', emoji: '📊'},
      {name: 'Master Craft', emoji: '⭐'},
      {name: 'AI Chat Pro', emoji: '🤖'},
    ],
    stats: {games: 8, level: 'Insane', time: '40-50 min'},
  }
};

function selectClass(classNum) {
  // Update header theme
  const header = document.getElementById('headerBg');
  const data = CLASS_DATA[classNum];
  header.className = 'header ' + data.themeClass;

  // Update all buttons
  document.querySelectorAll('.class-btn').forEach(btn => {
    btn.style.opacity = btn.dataset.class == classNum ? '1' : '0.6';
    btn.style.transform = btn.dataset.class == classNum ? 'scale(1)' : 'scale(0.95)';
  });

  // Show/hide class pages
  document.querySelectorAll('.class-page').forEach(page => {
    page.classList.remove('active');
  });
  document.getElementById(`class-page-${classNum}`).classList.add('active');

  window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderClassPages() {
  const container = document.getElementById('classPages');

  Object.entries(CLASS_DATA).forEach(([classNum, data]) => {
    const page = document.createElement('div');
    page.id = `class-page-${classNum}`;
    page.className = `class-page ${data.themeClass} ${classNum == 1 ? 'active' : ''}`;

    const gamesHTML = data.games.map((game, idx) => `
      <div class="game-card" style="animation-delay:${idx * 0.05}s">
        <div class="game-icon">${game.emoji}</div>
        <div class="game-name">${game.name}</div>
      </div>
    `).join('');

    page.innerHTML = `
      <div class="container">
        <div class="class-info">
          <h2>${data.title}</h2>
          <p style="font-size:1.2rem;font-weight:600;opacity:0.9">${data.subtitle}</p>
          <p>${data.description}</p>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-num">${data.stats.games}</span>
            <div class="stat-label">Games</div>
          </div>
          <div class="stat">
            <span class="stat-num">${data.stats.level}</span>
            <div class="stat-label">Difficulty</div>
          </div>
          <div class="stat">
            <span class="stat-num">${data.stats.time}</span>
            <div class="stat-label">Duration</div>
          </div>
        </div>

        <h3 class="games-title">🎮 Available Games</h3>
        <div class="game-grid">${data.games.map((game, idx) => `
          <button class="game-card" onclick="openGame('${['quiz','count','balloon','memory','words','roti','tables','story'][idx]}')" style="animation-delay:${idx * 0.05}s">
            <div class="game-icon">${game.emoji}</div>
            <div class="game-name">${game.name}</div>
          </button>
        `).join('')}</div>
      </div>
    `;

    container.appendChild(page);
  });
}

// Game Variables
let kidClass = 1;
let gScore = 0;
const DIFF = {1:{addMax:5,subMax:5,countMax:10,wordLen:3,balMax:5},2:{addMax:9,subMax:9,countMax:20,wordLen:3,balMax:10},3:{addMax:15,subMax:12,countMax:30,wordLen:4,balMax:15},4:{addMax:25,subMax:20,countMax:50,wordLen:5,balMax:25},5:{addMax:50,subMax:40,countMax:100,wordLen:5,balMax:50}};

function D(){return DIFF[kidClass];}

// Modify selectClass to update kidClass
const originalSelectClass = selectClass;
selectClass = function(classNum) {
  kidClass = classNum;
  originalSelectClass(classNum);
};

function openGame(g){
  document.getElementById('gameView').style.display='flex';
  document.getElementById('gameTitle').textContent=['Quiz','Count','Balloon','Memory','Words','Fractions','Tables','Story'][['quiz','count','balloon','memory','words','roti','tables','story'].indexOf(g)];
  gScore=0;
  document.getElementById('gScore').textContent='0';
  GAMES[g]();
  window.scrollTo(0,0);
}

function closeGame(){
  document.getElementById('gameView').style.display='none';
  window.scrollTo(0,0);
}

function addScore(){
  gScore++;
  document.getElementById('gScore').textContent=gScore;
}

const stageEl=()=>document.getElementById('gameStage');
const GAMES={};
const PRAISE=["Yes!","Great!","Awesome!","Perfect!","Brilliant!","Excellent!"];
const FINE=["It's ok!","No worries!","Try again!","Close one!"];
const pick=a=>a[Math.floor(Math.random()*a.length)];

function tone(f,ty,v,d){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();f.forEach((fr,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.value=fr;o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime+i*.09;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.05);});}catch(e){}}
const ding=()=>tone([523,659,784],'sine',.16,.3);
const boop=()=>tone([200,150],'triangle',.12,.25);

GAMES.quiz=function(){
let quiz=[{e:'🍬',q:' + ? =',o:['','','',''],a:''},{e:'🎈',q:' - ? =',o:['','','',''],a:''}],i=0,right=0,lock=false;
const d=D();
const a1=1+Math.floor(Math.random()*d.addMax),b1=1+Math.floor(Math.random()*d.addMax);quiz[0]={e:'🍬',q:a1+' + '+b1+' = ?',o:[String(a1+b1),String(a1+b1+1),String(Math.max(0,a1+b1-1)),String(a1+b1+2)],a:String(a1+b1)};
const x=2+Math.floor(Math.random()*d.subMax),y=1+Math.floor(Math.random()*(x-1));quiz[1]={e:'🎈',q:x+' - '+y+' = ?',o:[String(x-y),String(x-y+1),String(Math.max(0,x-y-1)),String(x)],a:String(x-y)};
function q(){lock=false;const Q=quiz[i];const opts=Q.o.slice().sort(()=>Math.random()-.5);stageEl().innerHTML='<div style="background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)"><div style="font-size:.9rem;font-weight:700;color:#9B5DE5;margin-bottom:8px">Question '+(i+1)+' of '+quiz.length+'</div><div style="font-size:50px">'+Q.e+'</div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.25rem;line-height:1.3;margin-bottom:6px">'+Q.q+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px">'+opts.map(o=>'<button style="border:none;border-radius:16px;background:#fff;padding:14px 10px;cursor:pointer;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;color:#2D3A52;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .15s" onclick="GAMES._qa(\''+o+'\',this,event)">'+o+'</button>').join('')+'</div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;min-height:26px;margin-top:12px" id="gfb"></div></div>';}
GAMES._qa=function(ch,el,ev){if(lock)return;lock=true;const Q=quiz[i];const fb=document.getElementById('gfb');if(ch===Q.a){right++;addScore();el.style.background='linear-gradient(135deg,#C8F2DD,#9FE0C7)';fb.style.color='#28A87A';fb.textContent=pick(PRAISE)+' ⭐';ding();}else{el.style.background='#FFE3E6';el.style.color='#FF6B6B';fb.style.color='#FF6B6B';fb.textContent=pick(FINE)+' 💛';boop();}setTimeout(()=>{i++;if(i<quiz.length)q();else{const msg=right===quiz.length?'🏆 Perfect!':right===0?'🤗 Try Again':right===1?'⭐ Great!':'🌱 Good!';stageEl().innerHTML='<div style="background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)"><div style="font-family:Baloo 2,cursive;font-weight:800;font-size:3.2rem;color:#9B5DE5;line-height:1">'+msg+'</div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.25rem;line-height:1.3;margin-bottom:6px">You got '+right+' of '+quiz.length+'!</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button style="border:none;border-radius:100px;padding:12px 24px;cursor:pointer;color:#fff;background:#9B5DE5;box-shadow:0 4px 12px rgba(155,93,229,.3);transition:all .15s;font-family:Fredoka,sans-serif;font-weight:600;font-size:.95rem" onclick="GAMES.quiz()">Play Again 🔄</button><button style="border:none;border-radius:100px;padding:12px 24px;cursor:pointer;color:#2D3A52;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .15s;font-family:Fredoka,sans-serif;font-weight:600;font-size:.95rem" onclick="closeGame()">Home 🏠</button></div></div>';}},1500);};q();};

GAMES.count=function(){const d=D();let n=d.countMax;const e='🍎';function draw(){stageEl().innerHTML='<div style="background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)"><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.25rem;line-height:1.3;margin-bottom:6px">Count to '+n+'!</div><div style="display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:12px 0;font-size:32px">'+Array(Math.min(n,20)).fill(0).map((_,j)=>'<span>'+e+'</span>').join('')+(n>20?'<span style="font-size:1rem">+more</span>':'')+'</div><div style="font-family:Baloo 2,cursive;font-weight:800;font-size:3.2rem;color:#9B5DE5;line-height:1">'+n+'</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button style="border:none;border-radius:100px;padding:12px 24px;cursor:pointer;color:#fff;background:#9B5DE5;box-shadow:0 4px 12px rgba(155,93,229,.3);transition:all .15s;font-family:Fredoka,sans-serif;font-weight:600;font-size:.95rem" onclick="GAMES._ci(event)">✓ Correct</button><button style="border:none;border-radius:100px;padding:12px 24px;cursor:pointer;color:#2D3A52;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .15s;font-family:Fredoka,sans-serif;font-weight:600;font-size:.95rem" onclick="closeGame()">Home</button></div></div>';}GAMES._ci=function(){addScore();ding();draw();if(gScore>=3)closeGame();};draw();};

GAMES.balloon=function(){const d=D();let target=0,popped=0;function newTarget(){const a=1+Math.floor(Math.random()*Math.min(d.addMax,9)),b=1+Math.floor(Math.random()*Math.min(d.addMax,9));target=a+b;stageEl().innerHTML='<div style="background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)"><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.25rem">Pop = '+a+' + '+b+'!</div><div style="font-size:3rem;margin:20px 0">🎈</div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.25rem">'+target+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px"><button style="border:none;border-radius:16px;background:#fff;padding:14px 10px;cursor:pointer;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;color:#2D3A52;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .15s" onclick="GAMES._pop('+target+',true,event)">'+target+'</button><button style="border:none;border-radius:16px;background:#fff;padding:14px 10px;cursor:pointer;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;color:#2D3A52;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .15s" onclick="GAMES._pop('+Math.max(1,target-1)+',false,event)">'+Math.max(1,target-1)+'</button><button style="border:none;border-radius:16px;background:#fff;padding:14px 10px;cursor:pointer;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;color:#2D3A52;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .15s" onclick="GAMES._pop('+Math.max(1,target+1)+',false,event)">'+Math.max(1,target+1)+'</button></div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;min-height:26px;margin-top:12px" id="gfb"></div></div>';}GAMES._pop=function(v,isCorrect,ev){if(isCorrect){popped++;addScore();ding();document.getElementById('gfb').textContent=pick(PRAISE)+' 🎉';if(popped>=3){stageEl().innerHTML='<div style="background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)"><div style="font-family:Baloo 2,cursive;font-weight:800;font-size:3.2rem;color:#9B5DE5;line-height:1">🎉</div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.25rem">You popped '+popped+'!</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button style="border:none;border-radius:100px;padding:12px 24px;cursor:pointer;color:#fff;background:#9B5DE5;box-shadow:0 4px 12px rgba(155,93,229,.3);transition:all .15s;font-family:Fredoka,sans-serif;font-weight:600;font-size:.95rem" onclick="GAMES.balloon()">Play Again</button><button style="border:none;border-radius:100px;padding:12px 24px;cursor:pointer;color:#2D3A52;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .15s;font-family:Fredoka,sans-serif;font-weight:600;font-size:.95rem" onclick="closeGame()">Home</button></div></div>';}else newTarget();}else{boop();document.getElementById('gfb').textContent=pick(FINE)+' Try again';}};newTarget();};

GAMES.memory=function(){const d=D();const all=['🍎','🐱','⭐','🎈','🌸','🐶'];const pairs=all.slice(0,Math.min(d.memPairs||3,3));let deck=pairs.concat(pairs).sort(()=>Math.random()-.5);let flipped=[],matched=0,lock=false;stageEl().innerHTML='<div style="background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)"><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.25rem">Match pairs!</div><div style="display:grid;grid-template-columns:repeat(3,60px);gap:8px;margin:20px auto;justify-content:center" id="memGrid">'+deck.map((e,i)=>'<div id="mc'+i+'" onclick="GAMES._mf('+i+')" style="width:60px;height:60px;background:#F4EFFF;border:2px solid #9B5DE5;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer">❓</div>').join('')+'</div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;min-height:26px;margin-top:12px" id="gfb"></div></div>';GAMES._mf=function(i){if(lock)return;const card=document.getElementById('mc'+i);if(card.textContent!=='❓')return;card.textContent=deck[i];flipped.push(i);if(flipped.length===2){lock=true;const[a,b]=flipped;if(deck[a]===deck[b]){matched++;addScore();ding();flipped=[];lock=false;if(matched===pairs.length){document.getElementById('gfb').textContent='All matched! 🌟';}else setTimeout(()=>{},500);}else{setTimeout(()=>{document.getElementById('mc'+a).textContent='❓';document.getElementById('mc'+b).textContent='❓';flipped=[];lock=false;boop();},800);}}};};

GAMES.words=function(){const W=[['CAT','🐱'],['DOG','🐶'],['SUN','☀️'],['BUS','🚌']];let wi=0;function draw(){const word=W[wi][0];stageEl().innerHTML='<div style="background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)"><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.25rem">Spell it!</div><div style="font-size:50px;margin:10px 0">'+W[wi][1]+'</div><div style="font-weight:700;color:#9B5DE5;margin:15px 0">'+word+'</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button style="border:none;border-radius:100px;padding:12px 24px;cursor:pointer;color:#fff;background:#9B5DE5;box-shadow:0 4px 12px rgba(155,93,229,.3);transition:all .15s;font-family:Fredoka,sans-serif;font-weight:600;font-size:.95rem" onclick="GAMES._wn()">Next ➡️</button><button style="border:none;border-radius:100px;padding:12px 24px;cursor:pointer;color:#2D3A52;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .15s;font-family:Fredoka,sans-serif;font-weight:600;font-size:.95rem" onclick="closeGame()">Home</button></div></div>';}GAMES._wn=function(){wi=(wi+1)%W.length;addScore();ding();draw();};draw();};

GAMES.tables=function(){const d=D();function q(){const a=2+Math.floor(Math.random()*(d.tabMax||3-1)),b=1+Math.floor(Math.random()*3),ans=a*b;const opts=[ans,ans+a,Math.max(1,ans-a)].sort(()=>Math.random()-.5);stageEl().innerHTML='<div style="background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)"><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.25rem">'+a+' × '+b+' = ?</div><div style="font-size:2rem;margin:15px 0;color:#9B5DE5">'+a+' × '+b+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px">'+opts.map(o=>'<button style="border:none;border-radius:16px;background:#fff;padding:14px 10px;cursor:pointer;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;color:#2D3A52;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .15s" onclick="GAMES._ta('+o+','+ans+',this,event)">'+o+'</button>').join('')+'</div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;min-height:26px;margin-top:12px" id="gfb"></div></div>';}GAMES._ta=function(v,ans,el,ev){if(v===ans){addScore();el.style.background='linear-gradient(135deg,#C8F2DD,#9FE0C7)';document.getElementById('gfb').style.color='#28A87A';document.getElementById('gfb').textContent=pick(PRAISE)+' ⭐';ding();}else{el.style.background='#FFE3E6';el.style.color='#FF6B6B';document.getElementById('gfb').style.color='#FF6B6B';document.getElementById('gfb').textContent=pick(FINE)+' 💛';boop();}setTimeout(q,1200);};q();};
